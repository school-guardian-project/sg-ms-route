services:
  ms-route.api:
    container_name: ms-route
    image: ms-route.api
    build:
      context: .
      dockerfile: src/ms-route.Api/Dockerfile
    ports:
      - "8080"
      - "5001"
    env_file:
      - .env
    environment:
      Kestrel__Endpoints__Http__Url: "${Kestrel__Endpoints__Http__Url:-http://+:8080}"
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: "${Kestrel__Endpoints__Grpc__Url:-http://+:5001}"
      Kestrel__Endpoints__Grpc__Protocols: Http2
      Fleet__GrpcAddress: "${Fleet__GrpcAddress:-http://ms-fleet:5001}"
      Family__GrpcAddress: "${Family__GrpcAddress:-http://ms-user-management:5001}"
    networks:
      - sg-services-network

  ms-route.tests:
    container_name: ms-route-tests
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./:/src
    command: dotnet test ./tests/ms-route.Tests/ --nologo
    profiles: [ "tests" ]
    networks:
      - sg-services-network

networks:
  sg-services-network:
    external: true
