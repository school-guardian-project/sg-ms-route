syntax = "proto3";

// Contract v1 for ms-route's interactions with ms-fleet (bus assigned to driver).
// The HTTP counterpart (/api/buses/assigned/{profileId}) was removed:
// inter-service traffic is gRPC only (ADR-005).
//
// Authentication: metadata header "x-internal-api-key" (shared secret from env).
package route.v1;

option csharp_namespace = "ms_route.Api.Infrastructure.Grpc";

service RouteService {
  // Returns the bus ID assigned to a driver profile, or null.
  rpc GetBusIdAssignedToDriver (GetBusIdAssignedToDriverRequest) returns (GetBusIdAssignedToDriverResponse);
}

message GetBusIdAssignedToDriverRequest {
  string profile_id = 1;
}

message GetBusIdAssignedToDriverResponse {
  string bus_id = 1;
}